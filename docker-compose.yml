services:
  app:
    container_name: studio-booking-api
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - '${PORT}:3000'
    volumes:
      - .:/src
      - studio-booking-api-modules:/src/node_modules
    environment:
      - PORT=${PORT}
      - NODE_ENV=${NODE_ENV}
      - DB_TYPE=${DB_TYPE}
      - DB_HOST=studio-booking-api-database
      - DB_PORT=5432
      - DB_USER=${DB_USER}
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_DATABASE=${DB_DATABASE}
      - JWT_SECRET=${JWT_SECRET}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN}
      - REFRESH_TOKEN_EXPIRES_IN_DAYS=${REFRESH_TOKEN_EXPIRES_IN_DAYS}
      - REDIS_HOST=studio-booking-api-redis
      - REDIS_PORT=6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - studio-booking-api-network
    command: npm run start:dev

  db:
    image: postgres:alpine
    container_name: studio-booking-api-database
    ports:
      - '${DB_PORT}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_DATABASE}']
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - studio-booking-api-network

  redis:
    image: redis:alpine
    container_name: studio-booking-api-redis
    ports:
      - '${REDIS_PORT}:6379'
    volumes:
      - redis-data:/data
    command: ['redis-server', '--appendonly', 'yes']
    restart: unless-stopped
    networks:
      - studio-booking-api-network

networks:
  studio-booking-api-network:
    driver: bridge

volumes:
  studio-booking-api-modules:
  postgres_data:
    driver: local
  redis-data:
